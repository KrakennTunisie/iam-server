spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

keycloak:
  auth-server-url: http://localhost:8080
  realm: test-realm
  client-id: test-client
  client-secret: test-secret

  storage:
    local:
      root-path: ./target/test-storage
      public-base-url: http://billing-service:8081
  exchange-rate:
    api:
      base-url: https://api.exchangerate.host
      key: "test-key"
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test